{% extends 'base.html' %}

{% block page_title_text %}Eliminar Equipo{% endblock %}

{% block content %}
<div class="row">
  <div class="col-md-6 mx-auto">
    <div class="card shadow">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
        </div>
        <h4>¿Está seguro de eliminar este equipo?</h4>
        <p class="text-muted">Equipo: <strong>{{ equipo.tipo_equipo }}</strong> de <strong>{{ equipo.cliente.nombre }}</strong></p>
        <p class="text-danger">Esta acción no se puede deshacer.</p>
        
        <form method="post">
          {% csrf_token %}
          <div class="d-grid gap-2 d-md-flex justify-content-md-center">
            <a href="{% url 'recepcion:listado_equipos' %}" class="btn btn-secondary me-md-2">Cancelar</a>
            <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
